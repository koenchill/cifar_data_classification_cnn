# Release B controlled training (additive; does not replace guide baseline.yaml).
model: SimpleCNN
epochs: 10
lr: 0.001
batch_size: 32
seed: 42
device: cpu
log_every_n_batches: 50
artifact_dir: artifacts/controlled
early_stop_patience: 3
early_stop_min_delta: 0.0001
scheduler: step
scheduler_step_size: 5
scheduler_gamma: 0.1
identity: training
run_id: controlled-baseline
deterministic: true
smoke_max_batches: null
resume_from: null
