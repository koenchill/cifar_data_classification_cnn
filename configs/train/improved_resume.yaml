# Fast path: resume ImprovedCNN best (~78% test) instead of slow ResNet CPU transfer.
#   python scripts/train_controlled.py --config configs/train/improved_resume.yaml --live
model: ImprovedCNN
batch_norm: true
dropout: true
dropout_p: 0.3
train_augment: true
color_jitter: true
epochs: 35
lr: 0.0005
batch_size: 64
seed: 42
device: cpu
log_every_n_batches: 100
artifact_dir: artifacts/improved_resume
early_stop_patience: 5
early_stop_min_delta: 0.0001
scheduler: step
scheduler_step_size: 10
scheduler_gamma: 0.5
identity: training
run_id: improved-resume-v1
deterministic: true
data_root: ./data
split_manifest: data/splits/split_manifest.json
export_state_dict: model_best.pth
smoke_max_batches: null
resume_from: artifacts/improved_full/checkpoint_best.pt
