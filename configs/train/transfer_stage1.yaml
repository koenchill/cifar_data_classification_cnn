# Stage 1 — train classifier head only on ImageNet-pretrained ResNet18-CIFAR.
model: ResNet18CIFAR
pretrained: true
freeze_mode: backbone
normalize: imagenet
train_augment: true
color_jitter: true
epochs: 5
lr: 0.001
optimizer: adam
weight_decay: 0.0001
batch_size: 64
seed: 42
device: cpu
log_every_n_batches: 50
artifact_dir: artifacts/transfer_stage1
early_stop_patience: 4
early_stop_min_delta: 0.0001
scheduler: step
scheduler_step_size: 3
scheduler_gamma: 0.1
identity: training
run_id: transfer-stage1-head
deterministic: true
data_root: ./data
split_manifest: data/splits/split_manifest.json
export_state_dict: model_best.pth
smoke_max_batches: null
resume_from: null
