# Stage 2 — full fine-tune (unfrozen) with SGD + stronger regularization.
model: ResNet18CIFAR
pretrained: true
freeze_mode: none
normalize: imagenet
train_augment: true
color_jitter: true
epochs: 25
lr: 0.01
optimizer: sgd
momentum: 0.9
weight_decay: 0.0005
batch_size: 64
seed: 42
device: cpu
log_every_n_batches: 50
artifact_dir: artifacts/transfer_stage2
early_stop_patience: 6
early_stop_min_delta: 0.0001
scheduler: step
scheduler_step_size: 10
scheduler_gamma: 0.1
identity: training
run_id: transfer-stage2-full
deterministic: true
data_root: ./data
split_manifest: data/splits/split_manifest.json
export_state_dict: model_best.pth
smoke_max_batches: null
resume_from: null
