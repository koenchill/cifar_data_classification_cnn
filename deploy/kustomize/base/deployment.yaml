apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cifar-cnn-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cifar-cnn-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/health"
    spec:
      serviceAccountName: api
      automountServiceAccountToken: true
      # Inference node pool separation (taints applied on EKS node group)
      nodeSelector:
        cifar-cnn.io/pool: inference
      tolerations:
        - key: cifar-cnn.io/pool
          operator: Equal
          value: inference
          effect: NoSchedule
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: cifar-cnn-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Digests only — overlays replace this image reference.
          image: ghcr.io/koenchill/cifar_data_classification_cnn/api:digest-placeholder
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - secretRef:
                name: api-runtime
          env:
            - name: APP_ENV
              value: production
            - name: CIFAR_CNN_OIDC_MODE
              value: jwks
            - name: CIFAR_CNN_ALLOW_ANON_PREDICT
              value: "false"
            - name: MODEL_BUNDLE_PATH
              value: /app/models/bundles/simple_cnn-1.0.1
            - name: HOME
              value: /tmp
            - name: MPLCONFIGDIR
              value: /tmp/matplotlib
          # Phase 12 measured envelope (raised replicas to >=2 for availability)
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      # Explicitly forbid host namespaces / hostPath (policy tests assert absence)
      hostNetwork: false
      hostPID: false
      hostIPC: false
