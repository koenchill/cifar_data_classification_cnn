apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cifar-cnn-api
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: cifar-cnn-api
data:
  cifar-cnn-api.json: |
    {
      "title": "CIFAR-CNN API",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "tags": ["cifar-cnn", "slo"],
      "panels": [
        {
          "type": "stat",
          "title": "Availability (5m)",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "1 - (sum(rate(http_requests_total{namespace=\"cifar-cnn\",status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_requests_total{namespace=\"cifar-cnn\"}[5m])), 1e-9))"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "p95 latency (ms)",
          "gridPos": {"h": 8, "w": 12, "x": 6, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket{namespace=\"cifar-cnn\"}[5m])) by (le)) * 1000"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Auth denials (401/403)",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"cifar-cnn\",status=~\"401|403\"}[5m]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Available replicas",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "kube_deployment_status_replicas_available{namespace=\"cifar-cnn\",deployment=\"api\"}"
            }
          ]
        }
      ]
    }
