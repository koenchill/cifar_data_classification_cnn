# Requires External Secrets Operator + ClusterSecretStore `aws-secretsmanager`.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secretsmanager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: api
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-runtime
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: api-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OIDC_ISSUER: "{{ .oidc_issuer }}"
        OIDC_AUDIENCE: "{{ .oidc_audience }}"
        OIDC_JWKS_URL: "{{ .oidc_jwks_url }}"
        CIFAR_CNN_BUNDLE_HMAC_KEY: "{{ .bundle_hmac_key }}"
  data:
    - secretKey: oidc_issuer
      remoteRef:
        key: cifar-cnn/api/oidc
        property: issuer
    - secretKey: oidc_audience
      remoteRef:
        key: cifar-cnn/api/oidc
        property: audience
    - secretKey: oidc_jwks_url
      remoteRef:
        key: cifar-cnn/api/oidc
        property: jwks_url
    - secretKey: bundle_hmac_key
      remoteRef:
        key: cifar-cnn/api/bundle
        property: hmac_key
