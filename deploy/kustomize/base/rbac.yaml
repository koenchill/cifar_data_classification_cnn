# Tight, namespace-scoped RBAC — no cluster-admin, no secrets list for app identity.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: api-runtime
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: api-runtime
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: api-runtime
subjects:
  - kind: ServiceAccount
    name: api
    namespace: cifar-cnn
---
# External Secrets Operator sync identity (controller SA is cluster-scoped elsewhere).
# App SA must not get secrets create/update/delete.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-sync-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets", "secretstores"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-sync-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-sync-reader
subjects:
  - kind: ServiceAccount
    name: external-secrets
    namespace: external-secrets
