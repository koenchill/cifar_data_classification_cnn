[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cifar-cnn"
version = "0.1.0"
description = "CIFAR-10 CNN classification with enterprise delivery controls"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "koenchill" }]
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "matplotlib==3.9.4",
  "onnx==1.17.0",
  "onnxruntime==1.22.0",
  "fastapi==0.115.6",
  "uvicorn==0.34.0",
  "python-multipart==0.0.20",
  "PyJWT==2.10.1",
  "cryptography==44.0.0",
  "Pillow==11.1.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.0.1",
  "pytest==9.0.3",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "bandit==1.8.0",
  "pip-audit==2.7.3",
  "detect-secrets==1.5.0",
  "setuptools>=78.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cifar_cnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = ["scripts/_gen_phase_cards.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# FastAPI/Starlette dependency-injection defaults are intentional.
"src/cifar_cnn/api/**/*.py" = ["B008"]
"tests/security/**/*.py" = ["B008"]
"tests/contract/**/*.py" = ["B008"]
"tests/e2e/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cifar_cnn"]
mypy_path = "src"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
