[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cifar-cnn"
version = "0.1.0"
description = "CIFAR-10 CNN classification with enterprise delivery controls"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [{ name = "koenchill" }]
dependencies = [
  "torch==2.7.1",
  "torchvision==0.22.1",
  "matplotlib==3.9.4",
]

[project.optional-dependencies]
dev = [
  "pre-commit==4.0.1",
  "pytest==9.0.3",
  "ruff==0.8.4",
  "mypy==1.14.0",
  "bandit==1.8.0",
  "pip-audit==2.7.3",
  "detect-secrets==1.5.0",
  "setuptools>=78.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cifar_cnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
exclude = ["scripts/_gen_phase_cards.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["cifar_cnn"]
mypy_path = "src"
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
